*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1e2d45;
  --border:#1e2d45;--border2:#1e2d4566;
  --txt:#e2e8f0;--txt2:#94a3b8;--txt3:#4b6080;
  --hdr:rgba(17,24,39,0.97);
  --menu:#111827;
  --inp-bg:#0a0f1e;
  --scrollbar:#1e2d45;
}
html.light{
  --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e2e8f0;
  --border:#cbd5e1;--border2:#cbd5e166;
  --txt:#0f172a;--txt2:#475569;--txt3:#64748b;
  --hdr:rgba(255,255,255,0.97);
  --menu:#ffffff;
  --inp-bg:#f8fafc;
  --scrollbar:#cbd5e1;
}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;}
#root{min-height:100vh;}
select option{background:var(--bg2);color:var(--txt);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}
textarea{font-family:'Noto Sans TC',sans-serif;resize:vertical;}
input,select{min-height:44px;}
textarea{min-height:80px;}
/* date placeholder text */
input[type=date][data-ph]:not(:valid)::before{content:attr(data-ph);color:var(--txt3);pointer-events:none;}
input[type=date],input[type=date]:focus{
  -webkit-appearance:none;appearance:none;
  width:100%!important;min-width:0!important;max-width:100%!important;
  box-sizing:border-box!important;display:block!important;
  min-height:44px;line-height:1.4;overflow:hidden;
  position:relative;
}
/* iOS Safari：阻止日期文字溢出容器 */
input[type=date]::-webkit-date-and-time-value{
  text-align:left;width:100%;min-height:1.4em;display:block;
}
input[type=date]::-webkit-inner-spin-button{display:none;}
input[type=date]::-webkit-calendar-picker-indicator{
  filter:invert(0.4);flex-shrink:0;margin-left:auto;
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
}
html.light input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.6);}
.hs::-webkit-scrollbar{display:none;}
input,textarea,select{-webkit-user-select:text!important;user-select:text!important;pointer-events:auto!important;touch-action:manipulation;cursor:text;}
button{touch-action:manipulation;cursor:pointer;}
/* 底部導覽列 */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hdr);border-top:1px solid var(--border);height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;background:transparent;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;touch-action:manipulation;}
.bnav-icon{display:flex;align-items:center;justify-content:center;}
.bnav-lbl{font-size:11px;font-weight:700;color:var(--txt3);}
.bnav-item.active .bnav-lbl{color:#f59e0b;}
.bnav-pip{width:5px;height:5px;border-radius:50%;background:#f59e0b;}
/* 有底部導覽列的頁面，最底部留白 */
.has-bnav{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
/* 浮水印覆蓋層 */
.watermark-overlay{position:fixed;inset:0;pointer-events:none;user-select:none;z-index:50;}
/* 身分識別卡 */
.id-card-gold-bar{height:3px;background:linear-gradient(90deg,#c8a227 0%,rgba(200,162,39,0.25) 70%,transparent 100%);}
/* 下拉重新整理動畫 */
@keyframes ptr-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* V2: 優先級 */
/* V2: 底部浮動選單 */
.bsheet-ov{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.55);}
.bsheet{position:absolute;bottom:0;left:0;right:0;background:var(--menu);border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto;}
/* V2: 時間軸 */
.tl-item{position:relative;padding-left:32px;padding-bottom:18px;}
.tl-item::before{content:"";position:absolute;left:9px;top:10px;bottom:0;width:2px;background:var(--border2);}
.tl-item:last-child::before{display:none;}
.tl-dot{position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--bg);flex-shrink:0;}
@keyframes dot-pulse{0%,80%,100%{transform:scale(0.8);opacity:0.3}40%{transform:scale(1.2);opacity:1}}
/* V2: skeleton */
@keyframes sk-sh{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{border-radius:8px;background:linear-gradient(90deg,var(--bg3) 25%,color-mix(in srgb,var(--bg3) 60%,var(--bg2)) 50%,var(--bg3) 75%);background-size:200% 100%;animation:sk-sh 1.5s ease-in-out infinite;}
/* V2: 工作卡片 */
.work-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;cursor:pointer;text-align:center;flex:1;min-width:0;}
.work-tile:active{opacity:0.65;}
</style>

// ── 閒置登出（localStorage 版：背景分頁計時器被暫停也能正確判斷）───────────────
const IDLE_MS=8*60*60*1000; // 8 小時
const IDLE_KEY="riims_lastActiveAt";
let _lastActWrite=0;
function touchActivity(){
  const now=Date.now();
  if(now-_lastActWrite<30000)return; // 節流 30s
  _lastActWrite=now;
  try{localStorage.setItem(IDLE_KEY,String(now));}catch(_){}
}
function isIdleTimedOut(){
  try{const t=Number(localStorage.getItem(IDLE_KEY));return!!t&&(Date.now()-t>IDLE_MS);}catch(_){return false;}
}

async function fsGet(p){
  const snap=await getDoc(doc(_db,...p.split("/")));
  if(!snap.exists())return null;
  const raw=snap.data()?.data;
  return raw?JSON.parse(raw):null;
}
async function fsSet(p,obj){
  await setDoc(doc(_db,...p.split("/")),{data:JSON.stringify(obj)});
}
async function fsList(col){
  const snap=await getDocs(collection(_db,...col.split("/")));
  return snap.docs.map(d=>({id:d.id,...JSON.parse(d.data()?.data||"{}")}));
}
async function fsDel(p){
  await deleteDoc(doc(_db,...p.split("/")));
}

  // V2: 追蹤提醒 bottom sheet
  // V2: 最近案件（localStorage 快取）
  const [recentCases,setRecentCases]=useState(()=>{try{return JSON.parse(localStorage.getItem("riims_recent")||"[]");}catch{return[];}});
  // V2: 優先級快速設定
  const [showPrioSheet,setShowPrioSheet]=useState(false);

  // 身分驗證
  const [authUser,setAuthUser]=useState(null);

  const [pf,setPf]=useState({name:"",rank:"",unit:"",brigadeUnit:"",battalionUnit:"",subUnit:"",roles:["recruiter"],role:"recruiter",licenseType:"正編",licenseNo:"",licenseIssueDate:"",licenseExpiryDate:""});
  const [pfSaving,setPfSaving]=useState(false);
  const [retrying,setRetrying]=useState(false);
  const [loadingSlow,setLoadingSlow]=useState(false);

  // 主題：自動跟隨系統設定
  useEffect(()=>{
    const mq=window.matchMedia("(prefers-color-scheme: light)");
    const apply=isLight=>isLight?document.documentElement.classList.add("light"):document.documentElement.classList.remove("light");
    apply(mq.matches);
    const handler=ev=>apply(ev.matches);
    mq.addEventListener("change",handler);
    return()=>mq.removeEventListener("change",handler);
  },[]);

  // 單位 tab：切換進來時載入招募員列表
  useEffect(()=>{
    if(view!=="unitView")return;
    setUvLoading(true);
    fsList("users").then(all=>{setUvUsers((all||[]).filter(u=>u.status==="active"));setUvLoading(false);}).catch(()=>setUvLoading(false));
  },[view]);

  const toastRef=useRef(null);
  // 使用者有操作時更新活躍時間戳
  useEffect(()=>{if(view&&view!=="loading")touchActivity();},[view]);
  // 閒置 8 小時自動登出（背景回來時檢查 localStorage）
  useEffect(()=>{
    function onVis(){
      if(document.visibilityState==="hidden"){touchActivity();return;}
      // 白屏保護：React 掛載失敗才 reload
      const rootEmpty=!(document.getElementById("root")?.firstChild);
      if(rootEmpty){window.location.reload();return;}
      // 閒置超時 → 登出（onAuthStateChanged 接手跳登入頁，不需 reload）
      if(isIdleTimedOut()&&authUser){
        fbSignOut(_auth);
        toast_("閒置超過8小時，已自動登出");
      }
    }
    document.addEventListener("visibilitychange",onVis);
    return()=>document.removeEventListener("visibilitychange",onVis);
  },[authUser]);

  function toast_(msg,type="ok"){setToast({msg,type});clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2500);}

  // ── Data loader (runs after auth) ───────────────────────────────────────────
  async function loadAppData(){
    const [s,b,fbRaw]=await Promise.all([fsGet("settings/global"),fsList("batches"),fsGet("feedback/list")]);
    setFeedbackList(fbRaw||[]);
    const mergeHints=opts=>opts.map(s=>{const d=DEF.statusOptions.find(x=>x.id===s.id);return(d?.hint&&!s.hint)?{...s,hint:d.hint}:s;});
    const settings=s?{...DEF,...s,qualCheckItems:s.qualCheckItems||DEF.qualCheckItems,statusOptions:mergeHints(s.statusOptions||DEF.statusOptions),recruitUnits:s.recruitUnits||DEF.recruitUnits,recruitUnitProfiles:s.recruitUnitProfiles||DEF.recruitUnitProfiles}:DEF;
    const existingNames=(settings.recruitUnitProfiles||[]).map(p=>p.name);
    const missing=(settings.recruitUnits||[]).filter(n=>!existingNames.includes(n));
    const mergedProfiles=[...(settings.recruitUnitProfiles||[]),...missing.map(n=>({id:uid(),name:n,recruiters:[]}))];
    const sortedProfiles=[...mergedProfiles].sort((a,b)=>a.name.localeCompare(b.name,"zh-TW",{sensitivity:"base"}));
    if(missing.length>0){
      const syncCfg={...settings,recruitUnitProfiles:sortedProfiles,recruitUnits:[...new Set([...sortedProfiles.map(p=>p.name)])]};
      fsSet("settings/global",syncCfg).catch(()=>{}); // 非同步寫入，不阻塞載入
      setCfg(syncCfg);
    }else{setCfg(settings);}
    setUnitProfiles(sortedProfiles);
    // 批次補齊 schedule 欄位：只計算需要更新的，寫入在背景執行不阻塞
    const patched=b.map(batch=>{
      const keys=(batch.schedule||[]).map(s=>s.key);
      const miss=DEF_SCHED.filter(s=>!keys.includes(s.key));
      if(!miss.length)return batch;
      const up={...batch,schedule:[...(batch.schedule||[]),...miss.map(s=>({...s}))]};
      fsSet("batches/"+batch.id,up).catch(()=>{}); // 非同步寫入
      return up;
    });
    const sorted=patched.sort((a,z)=>(z.createdAt||"").localeCompare(a.createdAt||""));
    setBatches(sorted);
    if(!s)fsSet("settings/global",DEF).catch(()=>{}); // 非同步寫入
    return sorted;
  }

  // ── Auth state ──────────────────────────────────────────────────────────────
  // 安全逾時：5秒內 onAuthStateChanged 沒觸發就強制跳登入畫面
  useEffect(()=>{
    const t=setTimeout(()=>{
      setAuthReady(cur=>{if(!cur){setView("login");return true;}return cur;});
    },5000);
    const ts=setTimeout(()=>setLoadingSlow(true),6000);
    return()=>{clearTimeout(t);clearTimeout(ts);}
  },[]);
  // 主要 auth 狀態監聽
  useEffect(()=>{
    // 每個 Firebase 呼叫的逾時包裝（避免無限等待）
    function tout(p,ms,msg){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);}
    return onAuthStateChanged(_auth,async user=>{
      setAuthReady(true);
      // 閒置超時判斷：登入成功但距離上次操作超過 8 小時
      if(user&&isIdleTimedOut()){
        setAuthUser(null);setUserProfile(null);setView("login");
        fbSignOut(_auth);
        toast_("閒置超過8小時，已自動登出");
        return;
      }
      if(!user){setAuthUser(null);setUserProfile(null);setView("login");return;}
      touchActivity(); // 登入成功，記錄活躍時間
      setAuthUser(user);
      // 整體 auth+load 流程設 15 秒上限
      let done=false;
      const overallTimer=setTimeout(()=>{
        if(!done){setErrMsg("連線逾時（15s），請確認網路後重試");setView("error");}
      },15000);
      try{
        const profile=await tout(fsGetUser(user.uid),8000,"讀取個人資料逾時");
        if(!profile){setUserProfile(null);setView("profileSetup");done=true;return;}
        setUserProfile(profile);
        if(profile.status!=="active"){setView("pendingApproval");done=true;return;}
        const loadedBatches=await tout(loadAppData(),12000,"載入資料逾時");
        // 嘗試還原重新整理前的頁面位置
        const hs=window.history.state;
        let restored=false;
        if(hs?.page==="batch"&&hs?.batchId){
          const b=(loadedBatches||[]).find(x=>x.id===hs.batchId);
          if(b){try{const saved=sessionStorage.getItem("bpwd_"+b.id);if(saved===b.password){setCurBatch(b);setSq("");setFst("all");setBatchTab(hs.tab||"list");setView("batch");restored=true;}}catch(_){}}
        }else if(["home","more","admin"].includes(hs?.page)){setView(hs.page);restored=true;}
        if(!restored)setView("dashboard");
        done=true;
      }catch(err){if(!done){setErrMsg(err?.message||String(err));setView("error");done=true;}}
      finally{clearTimeout(overallTimer);}
    });
  },[]);

  // ── Auth helpers ────────────────────────────────────────────────────────────
  function signInGoogle(){
    if(loginInProgress)return;
    setLoginInProgress(true);
    // 15 秒逾時保險：popup 被靜默攔截時 Promise 可能永遠不 resolve/reject
    let settled=false;
    const tid=setTimeout(()=>{
      if(settled)return;
      settled=true;
      setLoginInProgress(false);
      setLoginPopupBlocked(true);
      toast_("登入逾時，請試用下方備用方式","err");
    },15000);
    signInWithPopup(_auth,_gProvider).then(()=>{
      settled=true;clearTimeout(tid);
      // 登入成功後 onAuthStateChanged 接手，不需要在這裡 setLoginInProgress(false)
    }).catch(err=>{
      if(settled)return;
      settled=true;clearTimeout(tid);
      setLoginInProgress(false);
      if(err?.code==="auth/popup-blocked"){
        setLoginPopupBlocked(true);
        toast_("瀏覽器封鎖了登入視窗，請使用下方備用方式","err");
        return;
      }
      // 使用者自己關掉 popup 或重複點擊取消：不顯示錯誤
      if(err?.code==="auth/popup-closed-by-user"||err?.code==="auth/cancelled-popup-request")return;
      toast_(err.message||String(err.code)||"登入失敗","err");
    });
  }
  function signInRedirect(){
    signInWithRedirect(_auth,_gProvider).catch(err=>toast_(err.message||"登入失敗","err"));
  }
  async function signOutUser(){
    await fbSignOut(_auth);
    setBatches([]);setCfg(null);setCurBatch(null);setFeedbackList([]);setUnitProfiles([]);
  }
  async function saveMyProfile(){
    if(!pf.name.trim()||!pf.rank||!pf.brigadeUnit){toast_("請填寫姓名、階級與旅級單位","err");return;}
    if(!authUser)return;
    setPfSaving(true);
    try{
      const combinedUnit=[pf.brigadeUnit,pf.battalionUnit].filter(Boolean).join("・");
      const profile={uid:authUser.uid,googleEmail:authUser.email,googleDisplayName:authUser.displayName,googlePhotoURL:authUser.photoURL,...pf,unit:combinedUnit,status:"pending",createdAt:todayStr()};
      await fsSetUser(authUser.uid,profile);
      setUserProfile(profile);
      syncUnitToConfig(combinedUnit);
      setView("pendingApproval");
      toast_("申請已送出，等待管理員審核");
    }catch(err){toast_(err.message,"err");}
    finally{setPfSaving(false);}
  }
  async function updateMyProfile(updates){
    if(!authUser||!userProfile)return;
    const up={...userProfile,...updates};
    await fsSetUser(authUser.uid,up);
    setUserProfile(up);
    toast_("資料已更新 ✓");
    if(updates.unit!==undefined&&updates.unit!==userProfile.unit)syncUnitToConfig(updates.unit);
  }
  // 將用戶單位自動同步到「掌握單位」設定
  async function syncUnitToConfig(unit){
    if(!unit)return;
    try{
      const s=await fsGet("settings/global");
      const cur={...DEF,...(s||{})};
      if((cur.recruitUnits||[]).includes(unit))return;
      const newCfg={...cur,recruitUnits:[...(cur.recruitUnits||[]),unit]};
      await fsSet("settings/global",newCfg);
      setCfg(c=>c?{...c,recruitUnits:newCfg.recruitUnits}:null);
    }catch(_){}
  }
  // 載入待審核用戶
  async function loadPendingUsers(){
    try{const all=await fsList("users");setPendingUsers(all.filter(u=>u.status==="pending"));}catch(_){}
  }
  // 核准用戶
  async function approveUser(user){
    const updated={...user,status:"active"};
    await fsSetUser(user.uid,updated);
    setPendingUsers(list=>list.filter(u=>u.uid!==user.uid));
    toast_("已核准 "+(user.googleDisplayName||user.googleEmail));
  }
  // 個人資料子頁儲存
  async function saveMPD(){
    if(!moreProfileDraft.name.trim()||!moreProfileDraft.rank||!moreProfileDraft.brigadeUnit){toast_("請填寫姓名、階級與旅級單位","err");return;}
    const combinedUnit=[moreProfileDraft.brigadeUnit,moreProfileDraft.battalionUnit].filter(Boolean).join("・");
    await updateMyProfile({name:moreProfileDraft.name.trim(),rank:moreProfileDraft.rank,unit:combinedUnit,brigadeUnit:moreProfileDraft.brigadeUnit,battalionUnit:moreProfileDraft.battalionUnit,roles:moreProfileDraft.roles||["recruiter"],role:(moreProfileDraft.roles||["recruiter"])[0]||"recruiter",subUnit:""});

    return{total:t.length,rev:t.filter(x=>x.interviewLogs&&x.interviewLogs.length>0).length,conf:t.filter(x=>getStId(x)===6).length,high:t.filter(x=>getStId(x)===5).length,none:t.filter(x=>!(x.interviewLogs||[]).length&&!getStId(x)).length};

  // ── Scroll Anchor Component ──────────────────────────────────────────────────
  function ScrollAnchor({seat,onDone}){
    const ref=useRef(null);
    useEffect(()=>{
      if(!seat&&seat!==0)return;
      let attempts=0;
      function tryScroll(){
        const target=document.getElementById("trainee-seat-"+seat);
        if(target){
          target.scrollIntoView({behavior:"smooth",block:"center"});
          onDone();
        }else if(attempts++<20){
          requestAnimationFrame(tryScroll);
        }else{
          onDone();
        }
      }
      requestAnimationFrame(tryScroll);
    },[seat]);
    return e("div",{ref,style:{display:"none"}});
  }

// 全域錯誤邊界：防止 React 崩潰時顯示空白畫面
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err){
      const msg=this.state.err?.message||String(this.state.err);
      return React.createElement("div",{style:{minHeight:"100vh",background:"#0a0f1e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,color:"#e2e8f0",fontFamily:"'Noto Sans TC',sans-serif",textAlign:"center"}},

        React.createElement("div",{style:{fontSize:11,color:"#94a3b8",background:"#111827",borderRadius:10,padding:"10px 14px",maxWidth:340,wordBreak:"break-all",textAlign:"left",marginBottom:16}},msg),
        React.createElement("button",{style:{background:"linear-gradient(135deg,#f59e0b,#ef4444)",border:"none",borderRadius:10,padding:"10px 24px",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"},onClick:()=>window.location.reload()},"重新載入")
      );
    }
    return this.props.children;
  }
}
