async function fsGet(p){const r=await fetch(`${BASE}/${p}?key=${KEY}`);if(r.status===404)return null;if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}const d=await r.json();return d.fields?.data?.stringValue?JSON.parse(d.fields.data.stringValue):null;}
async function fsSet(p,obj){const r=await fetch(`${BASE}/${p}?key=${KEY}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(obj)}}})});if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}}
async function fsList(col){const r=await fetch(`${BASE}/${col}?key=${KEY}`);if(!r.ok)return[];const d=await r.json();if(!d.documents)return[];return d.documents.map(doc=>({id:doc.name.split("/").pop(),...JSON.parse(doc.fields?.data?.stringValue||"{}")}));}

  const [tf,setTf]=useState(null); const [dirty,setDirty]=useState(false);

  useEffect(()=>{

      try{
        const[s,b]=await Promise.all([fsGet("settings/global"),fsList("batches")]);

        setCfg(settings);
        // 補舊梯次缺少的期程欄位
        const patchedBatches=await Promise.all(b.map(async batch=>{
          const existingKeys=(batch.schedule||[]).map(s=>s.key);
          const missing=DEF_SCHED.filter(s=>!existingKeys.includes(s.key));
          if(missing.length===0)return batch;
          const updated={...batch,schedule:[...(batch.schedule||[]),...missing.map(s=>({...s}))]};
          await fsSet(`batches/${batch.id}`,updated);
          return updated;
        }));
        setBatches(patchedBatches.sort((a,z)=>(z.createdAt||"").localeCompare(a.createdAt||"")));

  async function patchBatch(patch){
    const up={...curBatch,...patch};
    await fsSet(`batches/${up.id}`,up);

    try{

      const batch={id,...nb,traineeCount:count,createdAt:todayStr(),schedule:DEF_SCHED.map(s=>({...s})),trainees};
      await fsSet(`batches/${id}`,batch);
      setBatches(p=>[batch,...p]);
      setShowAB(false);setNb({unit:"",battalion:"",company:"",sequence:"",password:"",traineeCount:"30"});

    }catch(err){toast_(err.message,"err");}
    finally{setSaving(false);}

      for(let i=0;i<n-cur.length;i++) trainees.push({id:uid(),seat:maxSeat+i+1,name:"",education:"",city:"",serviceChoice:"",statusId:null,subReason:"",note:"",scheduleAtt:{}});

                    e("option",{value:"一年級上"},"一年級上學期"),
                    e("option",{value:"一年級下"},"一年級下學期"),
                    e("option",{value:"二年級上"},"二年級上學期"),
                    e("option",{value:"二年級下"},"二年級下學期"),
                    e("option",{value:"三年級上"},"三年級上學期"),
                    e("option",{value:"三年級下"},"三年級下學期")
                  ))
              : e("div",null,e("label",{style:S.lbl},"學校"),
              e("input",{style:S.inp,placeholder:"就讀／畢業學校",value:tf.school||"",onChange:ev=>utf({school:ev.target.value})})),
            e("div",null,e("label",{style:S.lbl},"科系"),
              e("input",{style:S.inp,placeholder:"就讀／畢業科系",value:tf.department||"",onChange:ev=>utf({department:ev.target.value})})),
            e("div",null,e("label",{style:S.lbl},"居住城市"),
              e("select",{style:S.sel,value:tf.city||"",onChange:ev=>utf({city:ev.target.value})},
                e("option",{value:""},"請選擇"),...CITIES.map(v=>e("option",{key:v},v)))),
            e("div",null,e("label",{style:S.lbl},"區 / 鄉鎮市"),
              e("select",{style:S.sel,value:tf.district||"",onChange:ev=>utf({district:ev.target.value})},
                e("option",{value:""},"請選擇"),
                ...(DISTRICTS[tf.city]||[]).map(d=>e("option",{key:d,value:d},d))
              )),
            e("div",null,e("label",{style:S.lbl},"工作經驗"),
              e("select",{style:S.sel,value:tf.workExp||"",onChange:ev=>utf({workExp:ev.target.value})},
                e("option",{value:""},"請選擇"),
                e("option",{value:"無"},"無"),
                e("option",{value:"有"},"有")
              )),
            tf.workExp==="有"&&e(React.Fragment,null,
              e("div",null,e("label",{style:S.lbl},"工作單位"),
                e("input",{style:S.inp,placeholder:"例：台積電、統一超商",value:tf.workPlace||"",onChange:ev=>utf({workPlace:ev.target.value})})),
              e("div",null,e("label",{style:S.lbl},"工作年資（年）"),
                e("input",{style:S.inp,type:"text",inputMode:"numeric",placeholder:"例：3",value:tf.workYears||"",onChange:ev=>utf({workYears:ev.target.value})}))
            )
          )
        ),

        // ── 資格審查 ────────────────────────────────────────────────────────
        e("div",{style:{...S.card,marginBottom:10}},
          e("div",{style:S.slbl},"▍ 資格審查"),
          // 體檢表日期 + 效期檢查
          e("div",{style:{marginBottom:12,paddingBottom:12,borderBottom:"1px solid #1e2d4566"}},
            e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}},
              e("div",null,
                e("div",{style:{fontSize:13,fontWeight:700,color:"#e2e8f0"}},"體檢表日期"),
                e("div",{style:{fontSize:11,color:"#4b6080"}},"體檢表上的檢查日期")
              ),
              (()=>{
                const medDate=qa.medicalDate;
                const expDate=(curBatch.schedule||[]).find(s=>s.key==="medical_exp")?.date;
                if(medDate&&expDate){
                  const diff=(new Date(expDate)-new Date(medDate))/(1000*60*60*24*365);
                  if(diff>1) return e("span",{style:{...S.tag("#ef4444"),fontSize:11}},"⚠️ 已過期");
                  return e("span",{style:{...S.tag("#22c55e"),fontSize:11}},"✅ 有效");
                }
                return null;
              })()
            ),
            e("input",{style:{...S.inp,minWidth:0},type:"date",value:qa.medicalDate||"",
              onChange:ev=>uqa({medicalDate:ev.target.value})})
          ),
          ...qualItems.map(({id,label,desc})=>e("div",{key:id,style:{marginBottom:12,paddingBottom:12,borderBottom:"1px solid #1e2d4566"}},
            e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}},
              e("div",null,
                e("div",{style:{fontSize:13,fontWeight:700,color:"#e2e8f0"}},label),
                e("div",{style:{fontSize:11,color:"#4b6080"}},desc)
              ),
              e("div",{style:{display:"flex",gap:6,flexShrink:0}},
                ...[["yes","是","#ef4444"],["no","否","#22c55e"]].map(([v,lbl,c])=>
                  e("button",{key:v,style:{padding:"5px 14px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Noto Sans TC',sans-serif",
                    background:qa[id]===v?c+"28":"transparent",
                    color:qa[id]===v?c:"#4b6080",
                    border:`2px solid ${qa[id]===v?c+"88":"#1e2d45"}`},
                    onClick:()=>uqa({[id]:v,[id+"Note"]:qa[id+"Note"]||""})
                  },lbl)
                )
              )
            ),
            qa[id]==="yes"&&e("input",{style:{...S.inp,fontSize:13},placeholder:"請說明詳細情況…",
              value:qa[id+"Note"]||"",onChange:ev=>uqa({[id+"Note"]:ev.target.value})})
          )),
          e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:4}},
            e("div",{style:{fontSize:13,fontWeight:700,color:"#e2e8f0"}},"整體資格判定"),
            e("div",{style:{display:"flex",gap:6}},
              ...[["pass","符合","#22c55e"],["fail","不符合","#ef4444"],["pending","待確認","#a855f7"]].map(([v,lbl,c])=>
                e("button",{key:v,style:{padding:"5px 14px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Noto Sans TC',sans-serif",
                  background:qa.result===v?c+"28":"transparent",
                  color:qa.result===v?c:"#4b6080",
                  border:`2px solid ${qa.result===v?c+"88":"#1e2d45"}`},
                  onClick:()=>uqa({result:v})
                },lbl)
              )
            )
          )
        ),

        // ── 意願訪談 ────────────────────────────────────────────────────────
        e("div",{style:{...S.card,marginBottom:10}},
          e("div",{style:S.slbl},"▍ 意願訪談"),

          // 資格不符 → 直接顯示不符合，不顯示意願選項
          qa.result==="fail"
          ? e("div",{style:{background:"#ef444415",border:"1px solid #ef444433",borderRadius:10,padding:"14px 16px",marginBottom:14,textAlign:"center"}},
              e("div",{style:{fontSize:20,marginBottom:6}},"❌"),
              e("div",{style:{fontSize:14,fontWeight:800,color:"#ef4444"}},  "資格不符"),
              e("div",{style:{fontSize:12,color:"#4b6080",marginTop:4}},"請至資格審查調整整體資格判定")
            )
          : e(React.Fragment,null,
              // 意願狀態（資格符合或待確認才顯示）
              e("div",{style:{marginBottom:14,paddingBottom:14,borderBottom:"1px solid #1e2d45"}},
                e("label",{style:S.lbl},"意願狀態"),
                // 若尚未完成資格審查，顯示提示
                !qa.result&&e("div",{style:{fontSize:11,color:"#f59e0b",marginBottom:8}},"⚠️ 請先完成上方資格審查再填寫意願"),
                e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,opacity:qa.result?1:0.5}},
                  ...sts.filter(s=>s.id!==1).map(s=>e("button",{key:s.id,
                    style:{padding:"9px 6px",fontSize:12,fontWeight:700,borderRadius:10,cursor:"pointer",
                      fontFamily:"'Noto Sans TC',sans-serif",transition:"all 0.15s",
                      background:tf.statusId===s.id?s.color+"28":"transparent",
                      color:tf.statusId===s.id?s.color:"#4b6080",
                      border:`2px solid ${tf.statusId===s.id?s.color+"99":"#1e2d45"}`},
                    onClick:()=>qa.result&&utf({statusId:s.id})
                  },
                  e("div",null,
                    `${s.emoji} ${s.label}`,
                    tf.statusId===s.id&&s.hint&&e("div",{style:{fontSize:10,color:s.color,marginTop:3,fontWeight:400,lineHeight:1.3}},s.hint)
                  )
                ))
                )
              ),

              // 新增約談紀錄表單
              e("div",{style:{marginBottom:14,paddingBottom:14,borderBottom:"1px solid #1e2d45"}},
                e("div",{style:{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10,letterSpacing:"0.05em"}},"＋ 新增約談紀錄"),
                e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 12px",marginBottom:8}},
                  e("div",null,e("label",{style:S.lbl},"訪談單位"),
                    e("input",{style:S.inp,placeholder:"例：陸軍司令部",value:newItvw.unit,onChange:ev=>setNewItvw(p=>({...p,unit:ev.target.value}))})),
                  e("div",null,e("label",{style:S.lbl},"訪談日期"),
                    e("input",{style:{...S.inp,maxWidth:"100%",minWidth:0},type:"date",value:newItvw.date,onChange:ev=>setNewItvw(p=>({...p,date:ev.target.value}))})),
                  e("div",null,e("label",{style:S.lbl},"訪談人員"),
                    e("input",{style:S.inp,placeholder:"招募員級職姓名",value:newItvw.interviewer,onChange:ev=>setNewItvw(p=>({...p,interviewer:ev.target.value}))})),
                  e("div",null,e("label",{style:S.lbl},"聯絡方式"),
                    e("input",{style:S.inp,placeholder:"電話 / LINE",value:newItvw.contact,onChange:ev=>setNewItvw(p=>({...p,contact:ev.target.value}))}))
                ),
                e("div",{style:{marginBottom:10}},
                  e("label",{style:S.lbl},"約談內容"),
                  e("textarea",{style:{...S.inp,minHeight:80,lineHeight:1.7},
                    placeholder:"記錄本次約談重點、訓員回應、後續追蹤事項…",
                    value:newItvw.note,onChange:ev=>setNewItvw(p=>({...p,note:ev.target.value}))})
                ),
                e("button",{style:{...S.btn("primary"),width:"100%"},onClick:addInterviewLog,disabled:saving},
                  saving?"新增中…":"📝 新增約談紀錄")
              ),

              // 約談紀錄列表
              e("div",null,
                e("div",{style:{fontSize:12,fontWeight:700,color:"#94a3b8",marginBottom:10,letterSpacing:"0.05em"}},
                  `約談紀錄（${(tf.interviewLogs||[]).length} 筆）`),
                (tf.interviewLogs||[]).length===0&&e("div",{style:{textAlign:"center",color:"#4b6080",fontSize:12,padding:"16px 0"}},"尚無約談紀錄"),
                ...[...(tf.interviewLogs||[])].reverse().map((log,i)=>{
                  const logSt=sts.find(s=>s.id===log.statusId);
                  return e("div",{key:log.id||i,style:{background:"#0a0f1e",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid #1e2d45"}},
                    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
                      e("div",{style:{flex:1,minWidth:0}},
                        e("div",{style:{fontSize:13,fontWeight:700,color:"#f8fafc"}},log.unit||"（未填單位）"),
                        e("div",{style:{fontSize:11,color:"#4b6080",marginTop:2}},[log.date&&(log.period?log.date+" "+log.period:log.date),log.interviewer].filter(Boolean).join(" · "))
                      ),
                      e("div",{style:{display:"flex",alignItems:"center",gap:6,flexShrink:0}},
                        logSt&&e("span",{style:{...S.tag(logSt.color),fontSize:10}},`${logSt.emoji} ${logSt.label}`),
                        e("button",{style:{...S.btn("ghost","sm"),padding:"3px 8px",fontSize:11},
                          onClick:()=>{setEditLogData({...log});setShowEditLog(true);}
                        },"✏️")
                      )
                    ),
                    log.note&&e("div",{style:{fontSize:13,color:"#cbd5e1",lineHeight:1.7,whiteSpace:"pre-wrap"}},log.note),
                    log.contact&&e("div",{style:{marginTop:8,paddingTop:8,borderTop:"1px solid #1e2d45"}},
                      e("span",{style:{fontSize:11,color:"#4b6080"}},`📱 ${log.contact}`)
                    )
                  );
                })
              )
            )
        ),

        e("div",{style:{height:48}})
      ),

      // 約談紀錄編輯 Modal（放在 trainee view 內）
      showEditLog&&editLogData&&e("div",{style:S.modal,onClick:ev=>ev.target===ev.currentTarget&&setShowEditLog(false)},
        e("div",{style:S.mBox},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
            e("div",{style:{fontSize:15,fontWeight:800,color:"#f8fafc"}},"編輯約談紀錄"),
            e("button",{style:{...S.btn("ghost","sm"),color:"#ef4444",borderColor:"transparent"},onClick:async()=>{
              if(!window.confirm("確定刪除此筆約談紀錄？"))return;
              const logs=(tf.interviewLogs||[]).filter(l=>l.id!==editLogData.id);
              const updated={...tf,interviewLogs:logs};
              setTf(updated);
              try{await patchBatch({trainees:(curBatch.trainees||[]).map(t=>t.id===updated.id?updated:t)});setShowEditLog(false);toast_("已刪除");}
              catch(err){toast_(err.message,"err");}
            }},"🗑️ 刪除")
          ),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 12px",marginBottom:10}},
            e("div",null,e("label",{style:S.lbl},"訪談單位"),
              e("input",{style:S.inp,value:editLogData.unit||"",onChange:ev=>setEditLogData(p=>({...p,unit:ev.target.value}))})),
            e("div",null,e("label",{style:S.lbl},"訪談日期"),
              e("div",{style:{display:"flex",gap:6}},
                e("input",{style:{...S.inp,flex:1,minWidth:0},type:"date",value:editLogData.date||"",onChange:ev=>setEditLogData(p=>({...p,date:ev.target.value}))}),
                e("select",{style:{...S.sel,width:80,flexShrink:0},value:editLogData.period||"",onChange:ev=>setEditLogData(p=>({...p,period:ev.target.value}))},
                  e("option",{value:""},"—"),
                  e("option",{value:"上午"},"上午"),
                  e("option",{value:"下午"},"下午")
                )
              )),
            e("div",null,e("label",{style:S.lbl},"招募員級職姓名"),
              e("input",{style:S.inp,value:editLogData.interviewer||"",onChange:ev=>setEditLogData(p=>({...p,interviewer:ev.target.value}))})),
            e("div",null,e("label",{style:S.lbl},"聯絡方式"),
              e("input",{style:S.inp,value:editLogData.contact||"",onChange:ev=>setEditLogData(p=>({...p,contact:ev.target.value}))}))
          ),
          e("div",{style:{marginBottom:16}},
            e("label",{style:S.lbl},"約談內容"),
            e("textarea",{style:{...S.inp,minHeight:88,lineHeight:1.7},value:editLogData.note||"",onChange:ev=>setEditLogData(p=>({...p,note:ev.target.value}))})
          ),
          e("div",{style:{display:"flex",gap:10}},
            e("button",{style:{...S.btn("ghost"),flex:1},onClick:()=>setShowEditLog(false)},"取消"),
            e("button",{style:{...S.btn("primary"),flex:1},onClick:async()=>{
              const logs=(tf.interviewLogs||[]).map(l=>l.id===editLogData.id?editLogData:l);
              const updated={...tf,interviewLogs:logs};
              setTf(updated);
              try{await patchBatch({trainees:(curBatch.trainees||[]).map(t=>t.id===updated.id?updated:t)});setShowEditLog(false);toast_("已更新 ✓");}
              catch(err){toast_(err.message,"err");}
            }},"儲存")
          )
        )
      )
    );
  }

  return null;
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
