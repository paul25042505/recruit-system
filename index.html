body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent;}
#root{min-height:100vh;}
select option{background:var(--bg2);color:var(--txt);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px;}
textarea{font-family:'Noto Sans TC',sans-serif;resize:vertical;}
input,select{min-height:44px;}
textarea{min-height:80px;}
/* date placeholder text */
input[type=date][data-ph]:not(:valid)::before{content:attr(data-ph);color:var(--txt3);pointer-events:none;}
input[type=date],input[type=date]:focus{
  -webkit-appearance:none;appearance:none;
  width:100%!important;min-width:0!important;max-width:100%!important;
  box-sizing:border-box!important;display:block!important;
  min-height:44px;line-height:1.4;overflow:hidden;
  position:relative;
}
/* iOS Safari：阻止日期文字溢出容器 */
input[type=date]::-webkit-date-and-time-value{
  text-align:left;width:100%;min-height:1.4em;display:block;
}
input[type=date]::-webkit-inner-spin-button{display:none;}
input[type=date]::-webkit-calendar-picker-indicator{
  filter:invert(0.4);flex-shrink:0;margin-left:auto;
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
}
html.light input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.6);}
.hs::-webkit-scrollbar{display:none;}
input,textarea,select{-webkit-user-select:text!important;user-select:text!important;pointer-events:auto!important;touch-action:manipulation;cursor:text;}
button{touch-action:manipulation;cursor:pointer;}
/* 底部導覽列 */
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hdr);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;background:transparent;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;touch-action:manipulation;}
.bnav-icon{font-size:22px;line-height:1;}
.bnav-lbl{font-size:10px;font-weight:700;color:var(--txt3);}
.bnav-item.active .bnav-lbl{color:#f59e0b;}
.bnav-pip{width:5px;height:5px;border-radius:50%;background:#f59e0b;}

/* 浮水印覆蓋層 */

/* 身分識別卡 */

async function fsGet(p){
  const snap=await getDoc(doc(_db,...p.split("/")));
  if(!snap.exists())return null;
  const raw=snap.data()?.data;
  return raw?JSON.parse(raw):null;
}
async function fsSet(p,obj){
  await setDoc(doc(_db,...p.split("/")),{data:JSON.stringify(obj)});
}
async function fsList(col){
  const snap=await getDocs(collection(_db,...col.split("/")));
  return snap.docs.map(d=>({id:d.id,...JSON.parse(d.data()?.data||"{}")}));
}
async function fsDel(p){
  await deleteDoc(doc(_db,...p.split("/")));
}

  // ── Pull-to-Refresh ─────────────────────────────────────────────────────────
  useEffect(()=>{
    // 建立指示器 DOM（固定在頂部，不影響 React render tree）
    const THRESHOLD=72;
    const wrap=document.createElement("div");
    wrap.style.cssText="position:fixed;top:0;left:0;right:0;z-index:999;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;height:0;overflow:hidden;will-change:height;";
    const icon=document.createElement("div");
    icon.textContent="↻";
    icon.style.cssText="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,0.35);background:var(--bg2);border:1px solid var(--border);color:var(--txt3);transition:transform 0.08s,color 0.12s;";
    wrap.appendChild(icon);
    document.body.appendChild(wrap);

    let startY=0,startEl=null,active=false,locked=false;

    function onStart(e){
      if(locked)return;
      startY=e.touches[0].clientY;
      startEl=e.target;
      active=false;
    }

    function onMove(e){
      if(locked)return;
      const dy=e.touches[0].clientY-startY;
      if(dy<=0){if(active){wrap.style.height="0";icon.style.transform="";active=false;}return;}
      // 往上找可捲動祖先，若已捲動則不啟動
      let el=startEl;
      while(el&&el!==document.body){
        if(el.scrollTop>0)return;
        el=el.parentElement;
      }
      active=true;
      const d=Math.min(dy*0.45,THRESHOLD*1.6);
      const prog=Math.min(d/THRESHOLD,1);
      wrap.style.height=d+"px";
      const ready=d>=THRESHOLD;
      icon.style.transform=`scale(${0.55+prog*0.45}) rotate(${ready?180:prog*160}deg)`;
      icon.style.color=ready?"#f59e0b":"var(--txt3)";
      if(dy>10)e.preventDefault();
    }

    function onEnd(){
      if(!active)return;
      active=false;
      const h=parseFloat(wrap.style.height)||0;
      if(h>=THRESHOLD){
        locked=true;
        icon.style.cssText+=";animation:ptr-spin 0.55s linear infinite;color:#f59e0b;";
        wrap.style.height="56px";
        // 清除快取並強制重整
        setTimeout(async()=>{
          try{
            if("caches"in window){
              const keys=await caches.keys();
              await Promise.all(keys.map(k=>caches.delete(k)));
            }
          }catch(_){}
          window.location.reload(true);
        },450);
      }else{
        wrap.style.transition="height 0.22s";
        wrap.style.height="0";
        setTimeout(()=>{wrap.style.transition="";icon.style.transform="";icon.style.color="var(--txt3)";},230);
      }
    }

    document.addEventListener("touchstart",onStart,{passive:true});
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onEnd);
    document.addEventListener("touchcancel",onEnd);

    return()=>{
      document.removeEventListener("touchstart",onStart);
      document.removeEventListener("touchmove",onMove);
      document.removeEventListener("touchend",onEnd);
      document.removeEventListener("touchcancel",onEnd);
      if(wrap.parentNode)wrap.parentNode.removeChild(wrap);
    };
  },[]);

  // ── Watermark ───────────────────────────────────────────────────────────────

    const unit=userProfile.unit||"";

    const now=new Date();
    const dateStr=now.getFullYear()+"/"+(now.getMonth()+1).toString().padStart(2,"0")+"/"+now.getDate().toString().padStart(2,"0")+" "+now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
    const canvas=document.createElement("canvas");
    canvas.width=320;canvas.height=160;
    const ctx=canvas.getContext("2d");
    ctx.save();ctx.translate(160,80);ctx.rotate(-Math.PI/6);
    ctx.font="600 13px 'Noto Sans TC',sans-serif";
    const isDk=!document.documentElement.classList.contains("light");
    ctx.fillStyle=isDk?"rgba(255,255,255,0.045)":"rgba(0,0,0,0.04)";
    ctx.textAlign="center";
    ctx.fillText(unit,0,-18);ctx.fillText(rankName,0,2);ctx.fillText(dateStr,0,22);
    ctx.restore();
    return canvas.toDataURL();
  },[userProfile]);

  async function doAddBatch(){

    setSaving(true);
    try{

  async function doEditCount(){
    const n=parseInt(newCountVal);
    if(isNaN(n)||n<0){toast_("請輸入有效人數","err");return;}
    const cur=curBatch.trainees||[];
    let trainees=[...cur];

  function filterT(){
    return(curBatch?.trainees||[]).filter(t=>{

      // 資格不符：看資格審查結果
      if(t.qualCheck?.result==="fail"){
        const ms=fst==="all"||fst==="1";
        return mq&&ms;
      }
      // 其他：用最新約談紀錄的意願狀態
      const allLogs=t.interviewLogs||[];
      const lastLog=allLogs[allLogs.length-1];
      const fallback=(t.qualCheck?.result==="pass"&&t.statusId===1)?null:t.statusId;
      const latestStId=lastLog?.statusId||fallback;
      const ms=fst==="all"||(fst==="null"&&!latestStId)||String(latestStId)===fst;
      return mq&&ms;
    });

  // ── Scroll Anchor Component ──────────────────────────────────────────────────
  function ScrollAnchor({seat,onDone}){
    const ref=useRef(null);
    useEffect(()=>{
      if(!seat&&seat!==0)return;
      let attempts=0;
      function tryScroll(){
        const target=document.getElementById("trainee-seat-"+seat);
        if(target){
          target.scrollIntoView({behavior:"smooth",block:"center"});
          onDone();
        }else if(attempts++<20){
          requestAnimationFrame(tryScroll);
        }else{
          onDone();
        }
      }
      requestAnimationFrame(tryScroll);
    },[seat]);
    return e("div",{ref,style:{display:"none"}});
  }

              const latestHomeDate=editLogData.homeVisitDate||(()=>{const allL=[...logs].reverse();return allL.find(l=>l.homeVisitDate)?.homeVisitDate||"";})();
              const up={...tf,interviewLogs:logs,phoneVisitDate:latestPhoneDate,homeVisitDate:latestHomeDate};
              setTf(up);
              try{await patchBatch({trainees:(curBatch.trainees||[]).map(t=>t.id===up.id?up:t)});setShowEditLog(false);toast_("已更新 ✓");}
              catch(err){toast_(err.message,"err");}
            }},"儲存")
          )
        )
      )
    );
  }

  return null;
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
