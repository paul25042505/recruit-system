<script type="module">
import React,{useState,useEffect,useRef} from"react";
import {createRoot} from"react-dom/client";

// ═══ FIREBASE REST API（純 fetch，不使用 SDK）═══════════════════════════════
const PID="recruitment-sys-d1d78",KEY="AIzaSyBwdgl-e5ikVFCQqYoMmLIY6Ffg5hA9AAQ";
const BASE=`https://firestore.googleapis.com/v1/projects/${PID}/databases/(default)/documents`;

async function fsGet(p){
  const r=await fetch(`${BASE}/${p}?key=${KEY}`);
  if(r.status===404)return null;
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}
  const d=await r.json();
  return d.fields?.data?.stringValue?JSON.parse(d.fields.data.stringValue):null;
}
async function fsSet(p,obj){
  const r=await fetch(`${BASE}/${p}?key=${KEY}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(obj)}}})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`);}
}
async function fsList(col){
  const r=await fetch(`${BASE}/${col}?key=${KEY}`);
  if(!r.ok)return[];
  const d=await r.json();
  if(!d.documents)return[];
  return d.documents.map(doc=>({id:doc.name.split("/").pop(),...JSON.parse(doc.fields?.data?.stringValue||"{}")}));
}
async function fsDel(p){await fetch(`${BASE}/${p}?key=${KEY}`,{method:"DELETE"});}

// ═══ CONSTANTS ═══════════════════════════════════════════════════════════════
const DEF={

  units:["陸軍司令部","海軍司令部","空軍司令部","海軍陸戰隊","憲兵指揮部"],

const DEF_SCHED=[
  {key:"report",label:"報到日",date:""},
  {key:"army_pre",label:"陸軍先期宣",date:""},
  {key:"army_ext",label:"陸軍擴宣",date:""},
  {key:"central_ext",label:"中央擴宣",date:""},
  {key:"carnival",label:"嘉年華",date:""},
  {key:"will_deadline",label:"本梯次意願截止",date:""},
  {key:"w8_supplement",label:"八週補件截止",date:""},
  {key:"w8_enlist",label:"八週起役",date:""},
  {key:"w12_supplement",label:"十二週補件截止",date:""},
  {key:"w12_enlist",label:"十二週起役",date:""},
];
const EDUCATIONS=["高中職","專科","大學","研究所","其他"];
const CITIES=["台北市","新北市","桃園市","台中市","台南市","高雄市","基隆市","新竹市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","屏東縣","宜蘭縣","花蓮縣","台東縣","澎湖縣","金門縣","連江縣"];
const SERVICES=["陸軍","海軍","空軍","海軍陸戰隊","憲兵","不限"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ═══ STYLES ═══════════════════════════════════════════════════════════════════
const S={
  app:{minHeight:"100vh",background:"#0a0f1e",color:"#e2e8f0"},
  ctr:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"},
  hdr:{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",
    background:"rgba(17,24,39,0.97)",backdropFilter:"blur(12px)",
    borderBottom:"1px solid #1e2d45",position:"sticky",top:0,zIndex:100},
  sec:{padding:"14px 16px",maxWidth:640,margin:"0 auto"},
  card:{background:"#111827",border:"1px solid #1e2d45",borderRadius:14,padding:"14px 16px",marginBottom:10},
  modal:{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",display:"flex",
    alignItems:"flex-end",justifyContent:"center",zIndex:200,backdropFilter:"blur(4px)"},
  mBox:{background:"#111827",borderTop:"1px solid #1e2d45",borderRadius:"18px 18px 0 0",
    padding:"20px 20px 40px",width:"100%",maxWidth:520,maxHeight:"92vh",overflowY:"auto"},
  inp:{width:"100%",background:"#0a0f1e",border:"1px solid #1e2d45",borderRadius:9,
    padding:"10px 12px",color:"#e2e8f0",fontSize:14,outline:"none"},
  sel:{width:"100%",background:"#0a0f1e",border:"1px solid #1e2d45",borderRadius:9,
    padding:"10px 12px",color:"#e2e8f0",fontSize:14,outline:"none"},
  lbl:{display:"block",fontSize:11,color:"#4b6080",fontWeight:700,marginBottom:5,letterSpacing:"0.04em"},
  btn:(v="primary",sz="md")=>({
    display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5,border:"none",
    cursor:"pointer",fontFamily:"'Noto Sans TC',sans-serif",fontWeight:700,
    borderRadius:sz==="sm"?8:10,fontSize:sz==="sm"?12:14,
    padding:sz==="sm"?"6px 12px":"10px 18px",
    background:v==="primary"?"linear-gradient(135deg,#f59e0b,#ef4444)":v==="ghost"?"transparent":"#1e2d45",
    color:v==="ghost"?"#4b6080":"#fff",
    border:v==="ghost"?"1px solid #1e2d45":"none",
  }),
  badge:{background:"#1e2d45",color:"#4b6080",borderRadius:6,padding:"2px 8px",fontSize:11},
  tag:c=>({background:c+"20",color:c,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}),
  toast:t=>({position:"fixed",top:18,left:"50%",transform:"translateX(-50%)",
    background:t==="ok"?"#10b981":"#ef4444",color:"#fff",borderRadius:10,
    padding:"10px 22px",fontSize:13,fontWeight:700,zIndex:999,whiteSpace:"nowrap",
    boxShadow:"0 8px 32px rgba(0,0,0,0.5)"}),
  sec_lbl:{fontSize:11,fontWeight:800,color:"#f59e0b",letterSpacing:"0.12em",marginBottom:12},
};

// ═══ APP ══════════════════════════════════════════════════════════════════════
function App(){
  const [view,setView]=useState("loading");
  const [cfg,setCfg]=useState(null);
  const [batches,setBatches]=useState([]);
  const [curBatch,setCurBatch]=useState(null);
  const [toast,setToast]=useState(null);
  const [errMsg,setErrMsg]=useState("");
  const [saving,setSaving]=useState(false);
  // 新增梯次
  const [showAB,setShowAB]=useState(false);
  const [nb,setNb]=useState({unit:"",battalion:"",company:"",sequence:"",password:"",traineeCount:"30"});
  // 新增訓員
  const [showAT,setShowAT]=useState(false);
  const [newTName,setNewTName]=useState("");
  // 驗證
  const [aPwd,setAPwd]=useState(""); const [aPwdErr,setAPwdErr]=useState(false);
  const [bPwd,setBPwd]=useState(""); const [bPwdErr,setBPwdErr]=useState(false);
  const [pendBatch,setPendBatch]=useState(null);
  // 篩選
  const [sq,setSq]=useState(""); const [fst,setFst]=useState("all");
  // 訓員表單
  const [tf,setTf]=useState(null); const [dirty,setDirty]=useState(false);
  // 後台
  const [af,setAf]=useState(null);
  const [ni,setNi]=useState({units:"",battalions:"",companies:"",sequences:""});

  const toastTimer=useRef(null);

  function toast_(msg,type="ok"){
    setToast({msg,type});
    clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(null),2500);
  }

  useEffect(()=>{
    (async()=>{
      try{
        const[s,b]=await Promise.all([fsGet("settings/global"),fsList("batches")]);
        const settings=s||DEF;
        setCfg(settings);
        setBatches(b.sort((a,z)=>(z.createdAt||"").localeCompare(a.createdAt||"")));
        if(!s)await fsSet("settings/global",DEF);
        setView("home");
      }catch(err){setErrMsg(err?.message||String(err));setView("error");}
    })();
  },[]);

  async function patchBatch(patch){
    const up={...curBatch,...patch};
    await fsSet(`batches/${up.id}`,up);
    setCurBatch(up);setBatches(p=>p.map(b=>b.id===up.id?up:b));
    return up;
  }

  async function doAddBatch(){
    if(!nb.unit||!nb.battalion||!nb.sequence||!nb.password){toast_("請填寫所有必填欄位","err");return;}
    setSaving(true);
    try{
      const id=uid(),count=Math.max(0,parseInt(nb.traineeCount)||0);
      const trainees=Array.from({length:count},(_,i)=>({
        id:uid(),seat:i+1,name:"",education:"",city:"",serviceChoice:"",
        statusId:null,subReason:"",note:"",scheduleAtt:{}
      }));
      const batch={id,...nb,traineeCount:count,createdAt:todayStr(),
        schedule:DEF_SCHED.map(s=>({...s})),trainees};
      await fsSet(`batches/${id}`,batch);
      setBatches(p=>[batch,...p]);
      setShowAB(false);setNb({unit:"",battalion:"",company:"",sequence:"",password:"",traineeCount:"30"});
      toast_("梯次已建立 ✓");
    }catch(err){toast_(err.message,"err");}
    finally{setSaving(false);}
  }

  async function doDelBatch(id){
    if(!window.confirm("確定刪除此梯次？無法復原"))return;
    try{await fsDel(`batches/${id}`);setBatches(p=>p.filter(b=>b.id!==id));toast_("已刪除");}
    catch(err){toast_(err.message,"err");}
  }

  async function doAddTrainee(){
    const name=newTName.trim();
    if(!name){toast_("請輸入姓名","err");return;}
    const max=Math.max(0,...(curBatch.trainees||[]).map(t=>t.seat||0));
    const t={id:uid(),seat:max+1,name,education:"",city:"",serviceChoice:"",
      statusId:null,subReason:"",note:"",scheduleAtt:{}};
    try{
      await patchBatch({trainees:[...(curBatch.trainees||[]),t]});
      setNewTName("");setShowAT(false);toast_("訓員已新增 ✓");
    }catch(err){toast_(err.message,"err");}
  }

  async function saveTF(){
    if(!tf||!curBatch)return;
    setSaving(true);
    try{
      await patchBatch({trainees:(curBatch.trainees||[]).map(t=>t.id===tf.id?tf:t)});
      setDirty(false);toast_("已儲存 ✓");
    }catch(err){toast_(err.message,"err");}
    finally{setSaving(false);}
  }

  async function saveAF(){
    setSaving(true);
    try{await fsSet("settings/global",af);setCfg(af);setView("home");toast_("設定已儲存 ✓");}
    catch(err){toast_(err.message,"err");}
    finally{setSaving(false);}
  }

  function bStats(b){const t=b.trainees||[];return{total:t.length,rev:t.filter(x=>x.statusId).length,conf:t.filter(x=>x.statusId===6).length};}
  function filterT(){
    return(curBatch?.trainees||[]).filter(t=>{
      const q=sq.toLowerCase();
      return(!q||t.name?.toLowerCase().includes(q)||String(t.seat).includes(q))&&
        (fst==="all"||(fst==="null"&&!t.statusId)||String(t.statusId)===fst);
    });
  }
  function goT(b){setPendBatch(b);setBPwd("");setBPwdErr(false);setView("batchPwd");}
  function submitBPwd(){
    if(bPwd===pendBatch.password){setCurBatch(pendBatch);setSq("");setFst("all");setView("batch");}
    else setBPwdErr(true);
  }
  function submitAPwd(){
    if(aPwd===cfg.adminPassword){setAf({...cfg});setNi({units:"",battalions:"",companies:"",sequences:""});setView("admin");setAPwd("");}
    else setAPwdErr(true);
  }
  function openT(t){setTf({...t});setDirty(false);setView("trainee");}
  function utf(patch){setTf(p=>({...p,...patch}));setDirty(true);}

  const e=React.createElement;
  const sts=(cfg||DEF).statusOptions;
  const Toast=()=>toast?e("div",{style:S.toast(toast.type)},toast.msg):null;

  const [editIdx,setEditIdx]=useState({});
  const [editVal,setEditVal]=useState({});

  function listEd(field,label){
    const items=af[field]||[];
    return e("div",{style:{...S.card,marginBottom:10}},
      e("div",{style:S.sec_lbl},label),
      items.length===0&&e("div",{style:{color:"#4b6080",fontSize:12,marginBottom:8}},"（尚無項目）"),
      ...items.map((item,i)=>{
        const isEditing=editIdx[field]===i;
        return e("div",{key:i,style:{display:"flex",alignItems:"center",gap:6,marginBottom:6}},
          // 上下移動
          e("div",{style:{display:"flex",flexDirection:"column",gap:2,flexShrink:0}},
            e("button",{style:{...S.btn("ghost","sm"),padding:"2px 6px",opacity:i===0?0.2:1},
              disabled:i===0,
              onClick:()=>{
                const a=[...items];[a[i-1],a[i]]=[a[i],a[i-1]];
                setAf(p=>({...p,[field]:a}));
              }
            },"▲"),
            e("button",{style:{...S.btn("ghost","sm"),padding:"2px 6px",opacity:i===items.length-1?0.2:1},
              disabled:i===items.length-1,
              onClick:()=>{
                const a=[...items];[a[i+1],a[i]]=[a[i],a[i+1]];
                setAf(p=>({...p,[field]:a}));
              }
            },"▼")
          ),
          // 內容或編輯框
          isEditing
            ? e("input",{style:{...S.inp,flex:1,fontSize:13},value:editVal[field]??item,autoFocus:true,
                onChange:ev=>setEditVal(p=>({...p,[field]:ev.target.value})),
                onKeyDown:ev=>{
                  if(ev.key==="Enter"){
                    const v=(editVal[field]??item).trim();
                    if(v){const a=[...items];a[i]=v;setAf(p=>({...p,[field]:a}));}
                    setEditIdx(p=>({...p,[field]:null}));setEditVal(p=>({...p,[field]:undefined}));
                  }
                  if(ev.key==="Escape"){setEditIdx(p=>({...p,[field]:null}));setEditVal(p=>({...p,[field]:undefined}));}
                }
              })
            : e("div",{style:{flex:1,background:"#0a0f1e",borderRadius:7,padding:"7px 10px",fontSize:13,color:"#e2e8f0",cursor:"pointer"},
                onClick:()=>{setEditIdx(p=>({...p,[field]:i}));setEditVal(p=>({...p,[field]:item}));}
              },item),
          // 確認/取消 or 編輯/刪除
          isEditing
            ? e(React.Fragment,null,
                e("button",{style:{...S.btn("primary","sm"),padding:"5px 10px"},
                  onClick:()=>{
                    const v=(editVal[field]??item).trim();
                    if(v){const a=[...items];a[i]=v;setAf(p=>({...p,[field]:a}));}
                    setEditIdx(p=>({...p,[field]:null}));setEditVal(p=>({...p,[field]:undefined}));
                  }
                },"✓"),
                e("button",{style:{...S.btn("ghost","sm"),padding:"5px 10px"},
                  onClick:()=>{setEditIdx(p=>({...p,[field]:null}));setEditVal(p=>({...p,[field]:undefined}));}
                },"✕")
              )
            : e(React.Fragment,null,
                e("button",{style:{...S.btn("ghost","sm"),padding:"5px 9px",color:"#64748b"},
                  onClick:()=>{setEditIdx(p=>({...p,[field]:i}));setEditVal(p=>({...p,[field]:item}));}
                },"✏️"),
                e("button",{style:{...S.btn("ghost","sm"),color:"#ef4444",borderColor:"#ef444433",padding:"5px 9px"},
                  onClick:()=>setAf(p=>({...p,[field]:p[field].filter((_,j)=>j!==i)}))
                },"🗑️")
              )
        );
      }),
      e("div",{style:{display:"flex",gap:8,marginTop:8}},
        e("input",{style:{...S.inp,flex:1,fontSize:13},placeholder:`新增${label}…`,value:ni[field],
          onChange:ev=>setNi(p=>({...p,[field]:ev.target.value})),
          onKeyDown:ev=>{
            if(ev.key==="Enter"&&ni[field].trim()){
              setAf(p=>({...p,[field]:[...p[field],ni[field].trim()]}));
              setNi(p=>({...p,[field]:""}));
            }
          }
        }),
        e("button",{style:S.btn("primary","sm"),onClick:()=>{
          if(!ni[field].trim())return;
          setAf(p=>({...p,[field]:[...p[field],ni[field].trim()]}));
          setNi(p=>({...p,[field]:""}));
        }},"＋")
      )
    );
  }

  // ── LOADING ───────────────────────────────────────────────────────────────
  if(view==="loading")return e("div",{style:{...S.app,...S.ctr,minHeight:"100vh"}},
    e("div",{style:{fontSize:60,marginBottom:18}},"🎖️"),
    e("div",{style:{color:"#4b6080",fontSize:13,letterSpacing:"0.1em"}},"系統連線中…")
  );

  // ── ERROR ─────────────────────────────────────────────────────────────────
  if(view==="error")return e("div",{style:{...S.app,...S.ctr,minHeight:"100vh",padding:24}},
    e("div",{style:{textAlign:"center",maxWidth:360}},
      e("div",{style:{fontSize:52,marginBottom:10}},"⚠️"),
      e("div",{style:{color:"#ef4444",fontWeight:800,fontSize:16,marginBottom:8}},"連線失敗"),
      errMsg&&e("div",{style:{background:"#111827",border:"1px solid #ef444433",borderRadius:10,
        padding:12,fontSize:12,color:"#fca5a5",wordBreak:"break-all",textAlign:"left",marginBottom:16}},errMsg),
      e("button",{style:{...S.btn("primary"),padding:"12px 28px"},onClick:()=>window.location.reload()},"🔄 重新整理"),
      e("div",{style:{fontSize:11,color:"#4b6080",marginTop:14,lineHeight:1.8}},
        "請確認 Firestore 安全規則已設定並發布：",e("br"),
        e("code",{style:{color:"#f59e0b"}},"allow read, write: if true;"))
    )
  );

  // ── ADMIN PASSWORD ────────────────────────────────────────────────────────
  if(view==="adminPwd")return e("div",{style:{...S.app,...S.ctr,minHeight:"100vh"}},
    e(Toast),
    e("div",{style:{width:"100%",maxWidth:360,padding:28}},
      e("div",{style:{textAlign:"center",marginBottom:28}},
        e("div",{style:{fontSize:48,marginBottom:10}},"⚙️"),
        e("div",{style:{fontSize:18,fontWeight:800,color:"#f8fafc"}})
      ),
      e("input",{style:{...S.inp,textAlign:"center",fontSize:22,letterSpacing:"0.25em",marginBottom:10,padding:14},
        type:"password",placeholder:"管理員密碼",value:aPwd,autoFocus:true,
        onChange:ev=>{setAPwd(ev.target.value);setAPwdErr(false);},
        onKeyDown:ev=>ev.key==="Enter"&&submitAPwd()}),
      aPwdErr&&e("div",{style:{textAlign:"center",color:"#ef4444",fontSize:13,marginBottom:10,fontWeight:600}},"密碼錯誤"),
      e("button",{style:{...S.btn("primary"),width:"100%",padding:13,fontSize:15,marginBottom:8},onClick:submitAPwd},"進入後台"),
      e("button",{style:{...S.btn("ghost"),width:"100%",padding:10},onClick:()=>setView("home")},"← 返回")
    )
  );

  // ── ADMIN ─────────────────────────────────────────────────────────────────
  if(view==="admin"&&af)return e("div",{style:S.app},
    e(Toast),
    e("div",{style:S.hdr},
      e("button",{style:{...S.btn("ghost","sm"),padding:"6px 10px"},onClick:()=>setView("home")},"←"),
      e("div",{style:{flex:1}},e("div",{style:{fontSize:15,fontWeight:800,color:"#f8fafc"}},"後台管理")),
      e("button",{style:S.btn("primary","sm"),onClick:saveAF,disabled:saving},saving?"儲存…":"儲存設定")
    ),
    e("div",{style:{...S.sec,paddingTop:16}},
      e("div",{style:{...S.card,marginBottom:10}},
        e("div",{style:S.sec_lbl},"管理員密碼"),
        e("input",{style:S.inp,type:"password",placeholder:"新密碼",value:af.adminPassword,
          onChange:ev=>setAf(p=>({...p,adminPassword:ev.target.value}))})
      ),
      listEd("units","接訓單位"),
      listEd("battalions","營別"),
      listEd("companies","連別"),
      listEd("sequences","梯次選項"),
      e("div",{style:{...S.card,marginBottom:10}},
        e("div",{style:S.sec_lbl},"意願狀態"),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ...(af.statusOptions||[]).map(s=>
            e("div",{key:s.id,style:{background:"#0a0f1e",borderRadius:8,padding:"9px 12px",
              display:"flex",alignItems:"center",gap:8,border:`1px solid ${s.color}20`}},
              e("span",{style:{fontSize:16}},s.emoji),
              e("span",{style:{fontSize:12,color:s.color,fontWeight:700}},s.label)
            )
          )
        ),
        e("div",{style:{fontSize:11,color:"#4b6080",marginTop:10}},"意願狀態為固定值，如需更改請聯絡開發者")
      ),
      e("div",{style:{height:48}})
    )
  );

  // ── BATCH PASSWORD ────────────────────────────────────────────────────────
  if(view==="batchPwd")return e("div",{style:{...S.app,...S.ctr,minHeight:"100vh"}},
    e(Toast),
    e("div",{style:{width:"100%",maxWidth:360,padding:28}},
      e("div",{style:{textAlign:"center",marginBottom:28}},
        e("div",{style:{fontSize:48,marginBottom:10}},"🔒"),
        e("div",{style:{fontSize:17,fontWeight:800,color:"#f8fafc"}},"輸入專案密碼"),
        e("div",{style:{fontSize:12,color:"#4b6080",marginTop:6}},
          `${pendBatch?.unit}・${pendBatch?.battalion}`+
          (pendBatch?.company&&pendBatch.company!=="（無）"?`・${pendBatch.company}`:"")+
          `・${pendBatch?.sequence}`)
      ),
      e("input",{style:{...S.inp,textAlign:"center",fontSize:22,letterSpacing:"0.25em",marginBottom:10,padding:14},
        type:"password",placeholder:"••••••",value:bPwd,autoFocus:true,
        onChange:ev=>{setBPwd(ev.target.value);setBPwdErr(false);},
        onKeyDown:ev=>ev.key==="Enter"&&submitBPwd()}),
      bPwdErr&&e("div",{style:{textAlign:"center",color:"#ef4444",fontSize:13,marginBottom:10,fontWeight:600}},"密碼錯誤"),
      e("button",{style:{...S.btn("primary"),width:"100%",padding:13,fontSize:15,marginBottom:8},onClick:submitBPwd},"進入"),
      e("button",{style:{...S.btn("ghost"),width:"100%",padding:10},onClick:()=>setView("home")},"← 返回")
    )
  );

  // ── HOME ──────────────────────────────────────────────────────────────────
  if(view==="home")return e("div",{style:S.app},
    e(Toast),
    e("div",{style:S.hdr},
      e("div",{style:{flex:1}},
        e("div",{style:{fontSize:16,fontWeight:900,color:"#f8fafc",letterSpacing:"0.04em"}},"招募訓員管理系統"),
        e("div",{style:{fontSize:10,color:"#4b6080",letterSpacing:"0.08em"}},"RECRUITMENT MANAGEMENT SYSTEM")
      ),
      e("button",{style:{...S.btn("ghost","sm")},
        onClick:()=>{setAPwd("");setAPwdErr(false);setView("adminPwd");}},"⚙️ 後台")
    ),
    e("div",{style:S.sec},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        e("div",null,
          e("div",{style:{fontSize:18,fontWeight:800,color:"#f8fafc"}},"梯次列表"),
          e("div",{style:{fontSize:12,color:"#4b6080",marginTop:2}},`共 ${batches.length} 個梯次`)
        ),
        e("button",{style:S.btn("primary","sm"),onClick:()=>setShowAB(true)},"＋ 新增梯次")
      ),
      batches.length===0&&e("div",{style:{textAlign:"center",color:"#4b6080",padding:"60px 0"}},
        e("div",{style:{fontSize:48,marginBottom:12}},"📋"),
        e("div",{style:{fontSize:14}},"尚無梯次，請點擊新增")
      ),
      ...batches.map(b=>{
        const st=bStats(b),pct=st.total?Math.round(st.rev/st.total*100):0;
        const hc=b.company&&b.company!=="（無）";
        return e("div",{key:b.id,style:S.card},
          e("div",{style:{display:"flex",alignItems:"flex-start",gap:8,marginBottom:10}},
            e("div",{style:{flex:1,cursor:"pointer"},onClick:()=>goT(b)},
              e("div",{style:{fontSize:14,fontWeight:800,color:"#f8fafc",marginBottom:6}},
                `${b.unit}・${b.battalion}${hc?"・"+b.company:""}・${b.sequence}`),
              e("div",{style:{display:"flex",flexWrap:"wrap",gap:5}},
                e("span",{style:S.badge},`📅 ${b.createdAt}`),
                e("span",{style:S.badge},`👤 ${st.total} 人`),
                st.conf>0&&e("span",{style:S.tag("#10b981")},`✅ ${st.conf}`)
              )
            ),
            e("button",{style:{...S.btn("ghost","sm"),color:"#ef4444",borderColor:"transparent"},
              onClick:()=>doDelBatch(b.id)},"🗑️")
          ),
          e("div",{style:{cursor:"pointer"},onClick:()=>goT(b)},
            e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:5}},
              e("span",{style:{fontSize:11,color:"#4b6080"}},"訪談進度"),
              e("span",{style:{fontSize:11,color:"#4b6080"}},`${st.rev} / ${st.total}`)
            ),
            e("div",{style:{height:4,background:"#1e2d45",borderRadius:4,overflow:"hidden"}},
              e("div",{style:{height:"100%",width:`${pct}%`,
                background:"linear-gradient(90deg,#f59e0b,#ef4444)",borderRadius:4,transition:"width 0.4s"}})
            )
          )
        );
      }),
      e("div",{style:{height:32}})
    ),
    showAB&&e("div",{style:S.modal,onClick:ev=>ev.target===ev.currentTarget&&setShowAB(false)},
      e("div",{style:S.mBox},
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}},
          e("div",{style:{fontSize:16,fontWeight:800,color:"#f8fafc"}},"新增梯次"),
          e("button",{style:{...S.btn("ghost","sm"),padding:"4px 8px"},onClick:()=>setShowAB(false)},"✕")
        ),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 14px",marginBottom:12}},
          e("div",{style:{gridColumn:"span 2"}},
            e("label",{style:S.lbl},"接訓單位 *"),
            e("select",{style:S.sel,value:nb.unit,onChange:ev=>setNb(p=>({...p,unit:ev.target.value}))},
              e("option",{value:""},"請選擇"),
              ...(cfg?.units||DEF.units).map(o=>e("option",{key:o},o))
            )
          ),
          e("div",null,
            e("label",{style:S.lbl},"營別 *"),
            e("select",{style:S.sel,value:nb.battalion,onChange:ev=>setNb(p=>({...p,battalion:ev.target.value}))},
              e("option",{value:""},"請選擇"),
              ...(cfg?.battalions||DEF.battalions).map(o=>e("option",{key:o},o))
            )
          ),
          e("div",null,
            e("label",{style:S.lbl},"連別"),
            e("select",{style:S.sel,value:nb.company,onChange:ev=>setNb(p=>({...p,company:ev.target.value}))},
              e("option",{value:""},"請選擇"),
              ...(cfg?.companies||DEF.companies).map(o=>e("option",{key:o},o))
            )
          ),
          e("div",null,
            e("label",{style:S.lbl},"梯次 *"),
            e("input",{style:S.inp,placeholder:"例：第一梯、113年第2梯…",value:nb.sequence,
              onChange:ev=>setNb(p=>({...p,sequence:ev.target.value}))})
          ),
          e("div",null,
            e("label",{style:S.lbl},"訓員人數"),
            e("input",{style:S.inp,type:"number",min:"0",max:"500",value:nb.traineeCount,
              onChange:ev=>setNb(p=>({...p,traineeCount:ev.target.value}))})
          ),
          e("div",{style:{gridColumn:"span 2"}},
            e("label",{style:S.lbl},"專案密碼 *"),
            e("input",{style:S.inp,type:"password",placeholder:"設定進入密碼",value:nb.password,
              onChange:ev=>setNb(p=>({...p,password:ev.target.value}))})
          )
        ),
        e("div",{style:{display:"flex",gap:10}},
          e("button",{style:{...S.btn("ghost"),flex:1},onClick:()=>setShowAB(false)},"取消"),
          e("button",{style:{...S.btn("primary"),flex:1},onClick:doAddBatch,disabled:saving},saving?"建立中…":"建立梯次")
        )
      )
    )
  );

  // ── BATCH ─────────────────────────────────────────────────────────────────
  if(view==="batch"&&curBatch){
    const trainees=filterT();
    const sched=curBatch.schedule||DEF_SCHED;
    const hc=curBatch.company&&curBatch.company!=="（無）";
    return e("div",{style:S.app},
      e(Toast),
      e("div",{style:S.hdr},
        e("button",{style:{...S.btn("ghost","sm"),padding:"6px 10px"},onClick:()=>setView("home")},"←"),
        e("div",{style:{flex:1,minWidth:0}},
          e("div",{style:{fontSize:13,fontWeight:800,color:"#f8fafc",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
            `${curBatch.unit}・${curBatch.battalion}${hc?"・"+curBatch.company:""}・${curBatch.sequence}`),
          e("div",{style:{fontSize:11,color:"#4b6080"}},`共 ${curBatch.trainees?.length||0} 人`)
        )
      ),
      e("div",{style:S.sec},
        // 期程
        e("div",{style:{...S.card,marginBottom:12}},
          e("div",{style:S.sec_lbl},"▍ 梯次期程"),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr",gap:"8px"}},
            ...sched.map((s,i)=>e("div",{key:s.key||i,style:{display:"flex",alignItems:"center",gap:10}},
              e("label",{style:{...S.lbl,marginBottom:0,minWidth:110,flexShrink:0}},s.label),
              e("input",{style:{...S.inp,flex:1,fontSize:13},type:"date",value:s.date||"",
                onChange:ev=>{
                  const ns=sched.map((x,j)=>j===i?{...x,date:ev.target.value}:x);
                  patchBatch({schedule:ns});
                }
              })
            ))
          )
        ),
        // 搜尋 + 篩選
        e("input",{style:{...S.inp,marginBottom:8},placeholder:"🔍 搜尋姓名或座號…",
          value:sq,onChange:ev=>setSq(ev.target.value)}),
        e("div",{className:"hs",style:{display:"flex",gap:6,overflowX:"auto",paddingBottom:8}},
          e("button",{style:{...S.btn(fst==="all"?"primary":"ghost","sm"),flexShrink:0},onClick:()=>setFst("all")},"全部"),
          e("button",{style:{...S.btn(fst==="null"?"primary":"ghost","sm"),flexShrink:0},onClick:()=>setFst("null")},"未訪談"),
          ...sts.map(s=>e("button",{key:s.id,
            style:{...S.btn(fst===String(s.id)?"primary":"ghost","sm"),flexShrink:0,
              color:fst===String(s.id)?"#fff":s.color,
              border:`1px solid ${fst===String(s.id)?"transparent":s.color+"44"}`},
            onClick:()=>setFst(String(s.id))
          },`${s.emoji} ${s.label}`))
        ),
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"10px 0 8px"}},
          e("div",{style:{fontSize:12,color:"#4b6080"}},`顯示 ${trainees.length} 人`),
          e("button",{style:S.btn("primary","sm"),onClick:()=>{setNewTName("");setShowAT(true);}},"＋ 新增訓員")
        ),
        trainees.length===0&&e("div",{style:{textAlign:"center",color:"#4b6080",padding:40}},"無符合條件的訓員"),
        ...trainees.map(t=>{
          const st=sts.find(s=>s.id===t.statusId);
          return e("div",{key:t.id,style:{...S.card,cursor:"pointer",display:"flex",alignItems:"center",gap:12},
            onClick:()=>openT(t)},
            e("div",{style:{width:36,height:36,background:"#1e2d45",borderRadius:10,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:12,fontWeight:800,color:"#4b6080",flexShrink:0}},t.seat||"?"),
            e("div",{style:{flex:1,minWidth:0}},
              e("div",{style:{fontSize:14,fontWeight:700,color:t.name?"#f8fafc":"#4b6080"}},t.name||"（未填姓名）"),
              (t.education||t.city||t.serviceChoice)&&
                e("div",{style:{fontSize:11,color:"#4b6080",marginTop:2}},
                  [t.education,t.city,t.serviceChoice].filter(Boolean).join("・"))
            ),
            st?e("span",{style:S.tag(st.color)},`${st.emoji} ${st.label}`):
              e("span",{style:{...S.badge,color:"#2a3a50",fontSize:11}},"未訪談"),
            e("span",{style:{color:"#4b6080",fontSize:20,lineHeight:1}},"›")
          );
        }),
        e("div",{style:{height:40}})
      ),
      showAT&&e("div",{style:S.modal,onClick:ev=>ev.target===ev.currentTarget&&setShowAT(false)},
        e("div",{style:{...S.mBox,maxHeight:"50vh"}},
          e("div",{style:{fontSize:15,fontWeight:800,color:"#f8fafc",marginBottom:14}},"新增訓員"),
          e("div",{style:{marginBottom:16}},
            e("label",{style:S.lbl},"姓名"),
            e("input",{style:S.inp,placeholder:"請輸入訓員姓名",value:newTName,autoFocus:true,
              onChange:ev=>setNewTName(ev.target.value),
              onKeyDown:ev=>ev.key==="Enter"&&doAddTrainee()})
          ),
          e("div",{style:{display:"flex",gap:10}},
            e("button",{style:{...S.btn("ghost"),flex:1},onClick:()=>setShowAT(false)},"取消"),
            e("button",{style:{...S.btn("primary"),flex:1},onClick:doAddTrainee},"新增")
          )
        )
      )
    );
  }

  // ── TRAINEE ───────────────────────────────────────────────────────────────
  if(view==="trainee"&&tf&&curBatch){
    const curSt=sts.find(s=>s.id===tf.statusId);
    const sched=curBatch.schedule||DEF_SCHED;
    return e("div",{style:S.app},
      e(Toast),
      e("div",{style:S.hdr},
        e("button",{style:{...S.btn("ghost","sm"),padding:"6px 10px"},onClick:async()=>{
          if(dirty)await saveTF();setView("batch");
        }},"←"),
        e("div",{style:{flex:1,minWidth:0}},
          e("div",{style:{fontSize:15,fontWeight:800,color:"#f8fafc",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
            tf.name||"（未填姓名）"),
          e("div",{style:{fontSize:11,color:"#4b6080"}},`座號 ${tf.seat}`)
        ),
        dirty&&e("div",{style:{fontSize:10,color:"#f59e0b",fontWeight:700,marginRight:4,flexShrink:0}},"●"),
        e("button",{style:{...S.btn("primary","sm"),minWidth:54},onClick:saveTF,disabled:saving},saving?"儲存…":"儲存")
      ),
      e("div",{style:S.sec},
        // 基本資料
        e("div",{style:{...S.card,marginBottom:10}},
          e("div",{style:S.sec_lbl},"▍ 基本資料"),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 14px"}},
            e("div",null,e("label",{style:S.lbl},"座號"),
              e("input",{style:S.inp,type:"number",value:tf.seat||"",
                onChange:ev=>utf({seat:parseInt(ev.target.value)||""})})),
            e("div",null,e("label",{style:S.lbl},"姓名"),
              e("input",{style:S.inp,value:tf.name||"",placeholder:"請輸入",
                onChange:ev=>utf({name:ev.target.value})})),
            e("div",null,e("label",{style:S.lbl},"學歷"),
              e("select",{style:S.sel,value:tf.education||"",onChange:ev=>utf({education:ev.target.value})},
                e("option",{value:""},"請選擇"),...EDUCATIONS.map(v=>e("option",{key:v},v)))),
            e("div",null,e("label",{style:S.lbl},"居住城市"),
              e("select",{style:S.sel,value:tf.city||"",onChange:ev=>utf({city:ev.target.value})},
                e("option",{value:""},"請選擇"),...CITIES.map(v=>e("option",{key:v},v)))),
            e("div",{style:{gridColumn:"span 2"}},e("label",{style:S.lbl},"兵種志願"),
              e("select",{style:S.sel,value:tf.serviceChoice||"",onChange:ev=>utf({serviceChoice:ev.target.value})},
                e("option",{value:""},"請選擇"),...SERVICES.map(v=>e("option",{key:v},v))))
          )
        ),
        // 意願訪談
        e("div",{style:{...S.card,marginBottom:10}},
          e("div",{style:S.sec_lbl},"▍ 意願訪談"),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
            ...sts.map(s=>e("button",{key:s.id,
              style:{padding:"9px 6px",fontSize:12,fontWeight:700,borderRadius:10,cursor:"pointer",
                fontFamily:"'Noto Sans TC',sans-serif",transition:"all 0.15s",
                background:tf.statusId===s.id?s.color+"28":"transparent",
                color:tf.statusId===s.id?s.color:"#4b6080",
                border:`2px solid ${tf.statusId===s.id?s.color+"99":"#1e2d45"}`},
              onClick:()=>utf({statusId:s.id,subReason:"",note:""})
            },`${s.emoji} ${s.label}`))
          ),
          curSt?.subReasons?.length>0&&e("div",{style:{marginBottom:12}},
            e("label",{style:S.lbl},"子原因"),
            e("select",{style:S.sel,value:tf.subReason||"",onChange:ev=>utf({subReason:ev.target.value})},
              e("option",{value:""},"請選擇"),...curSt.subReasons.map(r=>e("option",{key:r},r)))
          ),
          curSt?.hasNote!==false&&e("div",null,
            e("label",{style:S.lbl},"訪談備註"),
            e("textarea",{style:{...S.inp,minHeight:88,lineHeight:1.7},
              placeholder:"記錄訪談內容…",value:tf.note||"",
              onChange:ev=>utf({note:ev.target.value})})
          )
        ),
        // 期程出席
        e("div",{style:{...S.card,marginBottom:10}},
          e("div",{style:S.sec_lbl},"▍ 期程出席"),
          e("div",{style:{display:"grid",gridTemplateColumns:"1fr",gap:6}},
            ...sched.map(s=>{
              const k=s.key||s.label;
              return e("div",{key:k,style:{display:"flex",alignItems:"center",gap:10,background:"#0a0f1e",borderRadius:9,padding:"9px 12px",border:"1px solid #1e2d45"}},
                e("div",{style:{flex:1}},
                  e("div",{style:{fontSize:12,fontWeight:700,color:"#94a3b8"}},s.label),
                  s.date&&e("div",{style:{fontSize:11,color:"#4b6080"}},s.date)
                ),
                e("select",{style:{...S.sel,width:"auto",fontSize:12,padding:"5px 8px"},
                  value:(tf.scheduleAtt||{})[k]||"",
                  onChange:ev=>utf({scheduleAtt:{...(tf.scheduleAtt||{}),[k]:ev.target.value}})},
                  e("option",{value:""},"—"),
                  e("option",{value:"present"},"✅ 出席"),
                  e("option",{value:"absent"},"❌ 缺席"),
                  e("option",{value:"late"},"⏰ 遲到")
                )
              );
            })
          )
        ),
        e("div",{style:{height:48}})
      )
    );
  }

  return null;
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
