name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write   # 寫回版號 commit 所需
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: ver
        run: |
          CURRENT=$(grep -oP 'const APP_VERSION="\K[^"]+' index.html | head -1)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          NEW="${MAJ}.${MIN}.$((PAT + 1))"
          sed -i "s/const APP_VERSION=\"${CURRENT}\"/const APP_VERSION=\"${NEW}\"/" index.html
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit & push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.ver.outputs.new }} [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發布版本通知
        run: |
          echo "## 🚀 發布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 內容 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **版本號** | \`v${{ steps.ver.outputs.new }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **發布時間** | $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S') 台北時間 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **網址** | ${{ steps.deployment.outputs.page_url }} |" >> "$GITHUB_STEP_SUMMARY"
