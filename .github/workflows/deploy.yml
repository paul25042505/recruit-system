name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 發布版本通知
        run: |
          TAG=$(grep -oP 'BUILD_TAG="\K[^"]+' index.html | head -1)
          echo "## 🚀 發布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 內容 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **BUILD_TAG** | \`${TAG:-unknown}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **發布時間** | $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S') 台北時間 |" >> "$GITHUB_STEP_SUMMARY"
