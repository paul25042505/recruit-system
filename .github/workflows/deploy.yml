name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: ver
        run: |
          CURRENT=$(grep -oP 'const APP_VERSION="\K[^"]+' index.html | head -1)
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          NEW="${MAJ}.${MIN}.$((PAT + 1))"
          sed -i "s/const APP_VERSION=\"${CURRENT}\"/const APP_VERSION=\"${NEW}\"/" index.html
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit & push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.ver.outputs.new }} [skip ci]"
          git push

      - name: Deploy to gh-pages branch
        run: |
          # 儲存要部署的檔案
          cp index.html /tmp/deploy-index.html
          cp logo.png /tmp/deploy-logo.png
          [ -f sw.js ] && cp sw.js /tmp/deploy-sw.js || true

          # 切到 gh-pages branch（已存在則更新，不存在則建立 orphan）
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . 2>/dev/null || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # 放入檔案
          cp /tmp/deploy-index.html index.html
          cp /tmp/deploy-logo.png logo.png
          [ -f /tmp/deploy-sw.js ] && cp /tmp/deploy-sw.js sw.js || true
          touch .nojekyll

          git add .
          git commit -m "deploy: v${{ steps.ver.outputs.new }}"
          git push --force origin gh-pages

      - name: 發布版本通知
        run: |
          echo "## 🚀 發布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 內容 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **版本號** | \`v${{ steps.ver.outputs.new }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **發布時間** | $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M:%S') 台北時間 |" >> "$GITHUB_STEP_SUMMARY"
